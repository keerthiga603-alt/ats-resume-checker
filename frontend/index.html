<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resume / JD Match Readout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4f2ec;
    --paper-raised: #ffffff;
    --ink: #1c2b2d;
    --ink-soft: #55625f;
    --rule: #d8d3c4;
    --accent: #1f6f5c;      /* signal green - "match" */
    --accent-soft: #dcebe4;
    --warn: #b23a2e;        /* signal red - "gap" */
    --warn-soft: #f4e1dc;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
  }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header.masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 32px;
  }

  header.masthead .title {
    font-family: var(--mono);
    font-weight: 700;
    letter-spacing: 0.02em;
    font-size: 22px;
    text-transform: uppercase;
  }

  header.masthead .title span {
    color: var(--accent);
  }

  header.masthead .meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
    line-height: 1.6;
  }

  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--ink-soft);
  }
  .status-dot.ok { background: var(--accent); }
  .status-dot.bad { background: var(--warn); }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  @media (max-width: 800px) {
    .grid { grid-template-columns: 1fr; }
  }

  .field {
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    padding: 18px;
  }

  .field label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .field label .tag {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 1px 6px;
  }

  textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    border: 1px solid var(--rule);
    background: #fbfaf6;
    padding: 12px;
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--ink);
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .upload-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
  }

  .upload-btn {
    font-family: var(--mono);
    font-size: 12px;
    border: 1px solid var(--ink);
    background: var(--paper-raised);
    padding: 8px 12px;
    cursor: pointer;
  }
  .upload-btn:hover { background: var(--ink); color: var(--paper); }

  .filename {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  input[type=file] { display: none; }

  .divider-or {
    text-align: center;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-soft);
    margin: 8px 0;
  }

  .run-row {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 14px;
    margin-top: 4px;
  }

  .error-msg {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--warn);
  }

  button.run {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 13px 26px;
    cursor: pointer;
  }
  button.run:hover { background: var(--accent); }
  button.run:disabled { background: var(--rule); color: var(--ink-soft); cursor: default; }

  /* ---- results ---- */
  #results { margin-top: 44px; display: none; }

  .readout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 32px;
    border-top: 2px solid var(--ink);
    padding-top: 28px;
  }
  @media (max-width: 800px) { .readout { grid-template-columns: 1fr; } }

  .gauge-block { text-align: center; }
  .gauge-caption {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-top: 10px;
  }
  .gauge-label {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 15px;
    margin-top: 4px;
    letter-spacing: 0.04em;
  }
  .gauge-label.compatible { color: var(--accent); }
  .gauge-label.not_compatible { color: var(--warn); }

  .score-num {
    font-family: var(--mono);
    font-weight: 700;
  }

  h3.section-h {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    margin: 0 0 14px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
  }

  .feature-row {
    display: grid;
    grid-template-columns: 190px 1fr 50px;
    align-items: center;
    gap: 12px;
    padding: 6px 0;
    font-family: var(--mono);
    font-size: 12px;
  }
  .feature-row .fname { color: var(--ink); }
  .feature-row .imputed { color: var(--ink-soft); font-style: italic; }
  .bar-track {
    background: var(--rule);
    height: 8px;
    position: relative;
  }
  .bar-fill { background: var(--accent); height: 100%; }
  .fval { text-align: right; color: var(--ink-soft); }

  .skills-block { margin-top: 26px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 9px;
    border: 1px solid var(--rule);
  }
  .chip.matched { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .chip.missing-req { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
  .chip.missing-pref { border-color: var(--ink-soft); color: var(--ink-soft); }
  .empty-note { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }

  .jd-facts {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 18px;
    display: flex;
    gap: 24px;
  }

  .loading {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="title">Match<span>Readout</span></div>
    <div class="meta" id="health-meta">
      <span><span class="status-dot" id="status-dot"></span><span id="status-text">checking model…</span></span><br/>
      <span id="model-info"></span>
    </div>
  </header>

  <div class="grid">
    <div class="field">
      <label>Resume <span class="tag">PDF / DOCX / paste</span></label>
      <div class="upload-row">
        <button type="button" class="upload-btn" id="pick-file">Choose file</button>
        <span class="filename" id="filename">No file selected</span>
      </div>
      <input type="file" id="resume-file" accept=".pdf,.docx" />
      <div class="divider-or">— or paste resume text below —</div>
      <textarea id="resume-text" placeholder="Paste resume text here if you'd rather not upload a file..."></textarea>
    </div>

    <div class="field">
      <label>Job description <span class="tag">paste text</span></label>
      <textarea id="jd-text" placeholder="Paste the full job description here, including requirements..." style="min-height: 292px;"></textarea>
    </div>

    <div class="run-row">
      <span class="error-msg" id="error-msg"></span>
      <span class="loading" id="loading-msg" style="display:none;">scoring…</span>
      <button class="run" id="run-btn">Run match</button>
    </div>
  </div>

  <div id="results">
    <div class="readout">
      <div class="gauge-block">
        <svg id="gauge" width="220" height="140" viewBox="0 0 220 140"></svg>
        <div class="gauge-label" id="gauge-label"></div>
        <div class="gauge-caption" id="gauge-caption"></div>
        <div class="jd-facts" id="jd-facts" style="justify-content:center;"></div>
      </div>

      <div>
        <h3 class="section-h">Feature breakdown</h3>
        <div id="feature-list"></div>

        <div class="skills-block">
          <h3 class="section-h">Skills</h3>
          <div id="skills-block"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);

async function checkHealth() {
  try {
    const res = await fetch('/api/health');
    const data = await res.json();
    if (data.model_loaded) {
      $('status-dot').className = 'status-dot ok';
      $('status-text').textContent = 'model ready';
      $('model-info').textContent = `${data.algorithm} · trained on ${data.trained_on_samples} samples`;
    } else {
      $('status-dot').className = 'status-dot bad';
      $('status-text').textContent = 'model not trained yet';
      $('model-info').textContent = 'run: python run_all_training.py';
    }
  } catch (e) {
    $('status-dot').className = 'status-dot bad';
    $('status-text').textContent = 'API unreachable';
  }
}
checkHealth();

let selectedFile = null;
$('pick-file').addEventListener('click', () => $('resume-file').click());
$('resume-file').addEventListener('change', (e) => {
  selectedFile = e.target.files[0] || null;
  $('filename').textContent = selectedFile ? selectedFile.name : 'No file selected';
});

function drawGauge(score) {
  // semicircular gauge, 0-100, needle-free arc fill
  const svg = $('gauge');
  const cx = 110, cy = 120, r = 90;
  const startAngle = Math.PI, endAngle = 0; // left to right over the top
  const frac = Math.max(0, Math.min(100, score)) / 100;
  const angle = startAngle + (endAngle - startAngle) * frac;

  const polarToXY = (a) => [cx + r * Math.cos(a), cy - r * Math.sin(a) * -1 + (cy - (cy - r))].slice(0,2);
  // simpler: y = cy - r*sin(a) but arc is upper half so sin(a) in [0,1] for a in [0,pi]
  const pt = (a) => [cx + r * Math.cos(a), cy - r * Math.sin(a)];

  const [x0, y0] = pt(startAngle);
  const [x1, y1] = pt(angle);
  const [xEnd, yEnd] = pt(endAngle);

  const trackPath = `M ${x0} ${y0} A ${r} ${r} 0 0 1 ${xEnd} ${yEnd}`;
  const largeArc = frac > 0.5 ? 1 : 0;
  const fillPath = frac > 0 ? `M ${x0} ${y0} A ${r} ${r} 0 ${largeArc} 1 ${x1} ${y1}` : '';

  const color = score >= 50 ? 'var(--accent)'.replace('var(--accent)', '#1f6f5c') : '#b23a2e';

  svg.innerHTML = `
    <path d="${trackPath}" fill="none" stroke="#d8d3c4" stroke-width="16" stroke-linecap="butt"/>
    ${fillPath ? `<path d="${fillPath}" fill="none" stroke="${color}" stroke-width="16" stroke-linecap="butt"/>` : ''}
    <text x="${cx}" y="${cy - 10}" text-anchor="middle" font-family="IBM Plex Mono" font-size="34" font-weight="700" fill="#1c2b2d">${score.toFixed(1)}</text>
    <text x="${cx}" y="${cy + 10}" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" fill="#55625f">/ 100</text>
  `;
}

function renderResults(data) {
  $('results').style.display = 'block';
  drawGauge(data.compatibility_score);

  const labelEl = $('gauge-label');
  labelEl.textContent = data.label === 'compatible' ? 'COMPATIBLE MATCH' : 'NOT A STRONG MATCH';
  labelEl.className = 'gauge-label ' + data.label;
  $('gauge-caption').textContent = `model confidence ${data.model_confidence}% · ${data.algorithm}`;

  const facts = [];
  if (data.jd_required_degree) facts.push(`degree: ${data.jd_required_degree}`);
  if (data.jd_required_years_experience) facts.push(`req. exp: ${data.jd_required_years_experience}y`);
  $('jd-facts').textContent = facts.join('   ·   ');

  const featureList = $('feature-list');
  featureList.innerHTML = '';
  data.feature_breakdown.forEach(f => {
    const pct = Math.max(0, Math.min(1, f.value)) * 100;
    const row = document.createElement('div');
    row.className = 'feature-row';
    row.innerHTML = `
      <div class="fname">${f.label}${f.imputed_with_training_median ? '<span class="imputed"> (est.)</span>' : ''}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="fval">${f.value.toFixed(2)}</div>
    `;
    featureList.appendChild(row);
  });

  const skillsBlock = $('skills-block');
  const chipRow = (title, items, cls) => {
    if (!items.length) return `<div class="empty-note">${title}: none</div>`;
    return `<div>${title}</div><div class="chip-row">${items.map(s => `<span class="chip ${cls}">${s}</span>`).join('')}</div>`;
  };
  skillsBlock.innerHTML = `
    <div style="margin-bottom:14px;">${chipRow('Matched', data.matched_skills, 'matched')}</div>
    <div style="margin-bottom:14px;">${chipRow('Missing — required', data.missing_required_skills, 'missing-req')}</div>
    <div>${chipRow('Missing — preferred', data.missing_preferred_skills, 'missing-pref')}</div>
  `;
}

async function runMatch() {
  $('error-msg').textContent = '';
  const jdText = $('jd-text').value.trim();
  const resumeTextArea = $('resume-text').value.trim();

  if (!jdText) {
    $('error-msg').textContent = 'Paste a job description first.';
    return;
  }
  if (!selectedFile && !resumeTextArea) {
    $('error-msg').textContent = 'Upload a resume file or paste resume text.';
    return;
  }

  $('run-btn').disabled = true;
  $('loading-msg').style.display = 'inline';

  try {
    let res;
    if (selectedFile) {
      const form = new FormData();
      form.append('resume_file', selectedFile);
      form.append('jd_text', jdText);
      res = await fetch('/api/predict', { method: 'POST', body: form });
    } else {
      res = await fetch('/api/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ resume_text: resumeTextArea, jd_text: jdText })
      });
    }
    const data = await res.json();
    if (!res.ok) {
      $('error-msg').textContent = data.error || 'Something went wrong.';
      return;
    }
    renderResults(data);
  } catch (e) {
    $('error-msg').textContent = 'Could not reach the API. Is api/app.py running?';
  } finally {
    $('run-btn').disabled = false;
    $('loading-msg').style.display = 'none';
  }
}

$('run-btn').addEventListener('click', runMatch);
</script>
</body>
</html>
